<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CB369"/>
      <stop offset="100%" stop-color="#5B8E5F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo del libro -->
  <rect width="400" height="600" fill="url(#bgGradient)" rx="12" filter="url(#shadow)"/>
  
  <!-- Marco decorativo -->
  <rect x="30" y="40" width="340" height="520" fill="none" stroke="#FFFCF2" stroke-width="2" rx="8"/>
  
  <!-- Título principal -->
  <text x="200" y="240" text-anchor="middle" font-family="'Playfair Display', serif" font-size="32" fill="#FFFCF2" font-weight="700">
    BIBLIOTECA
  </text>
  <text x="200" y="300" text-anchor="middle" font-family="'Playfair Display', serif" font-size="44" fill="#FFB703" font-weight="700">
    CANTARIBEÑA
  </text>
  
  <!-- Línea decorativa -->
  <line x1="120" y1="330" x2="280" y2="330" stroke="#FFFCF2" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Subtítulo -->
  <text x="200" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFCF2" opacity="0.9">
    Un regalo de historias
  </text>
  
  <!-- Icono de libro simplificado -->
  <g transform="translate(200, 480) scale(1.2)">
    <path d="M-30,-20 L30,-20 L30,20 L-30,20 Z" fill="none" stroke="#FFB703" stroke-width="2"/>
    <path d="M0,-20 L0,20" stroke="#FFFCF2" stroke-width="1.5"/>
    <path d="M-15,-10 L15,-10 M-15,0 L15,0 M-15,10 L15,10" stroke="#FFFCF2" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Detalle inferior -->
  <text x="200" y="550" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" fill="#FFFCF2" opacity="0.7">
    6 de Enero, 2026
  </text>
</svg>
